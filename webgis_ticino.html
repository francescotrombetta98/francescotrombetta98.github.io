<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGIS — Parco Naturale del Ticino Piemontese</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { background: #1f4e5f; color: white; padding: 0.8rem 1.5rem; display: flex; align-items: center; }
  header h1 { font-size: 1.05rem; }
  header a { color: #a8d8ea; text-decoration: none; font-size: 0.85rem; margin-left: auto; }
  #map { flex: 1; }
  .info-box { background: white; padding: 0.7rem 1rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 0.8rem; line-height: 1.6; max-width: 230px; }
  .info-box h4 { color: #1f4e5f; margin-bottom: 0.3rem; font-size: 0.88rem; border-bottom: 1px solid #ddd; padding-bottom: 0.3rem; }
  .legend { background: white; padding: 0.6rem 0.9rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 0.78rem; max-width: 210px; max-height: 280px; overflow-y: auto; }
  .legend h4 { color: #1f4e5f; margin-bottom: 0.4rem; font-size: 0.85rem; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .legend-color { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.2); }
</style>
</head>
<body>

<header>
  <h1>WebGIS — Parco Naturale del Ticino Piemontese</h1>
  <a href="ticino.html">← Torna al progetto</a>
</header>

<div id="map"></div>

<script>
const BASE = 'img/webgis/ticino/';

// Palette colori per tipologie forestali
const PALETTE = [
  '#8B4513','#228B22','#556B2F','#6B8E23','#2E8B57',
  '#3CB371','#20B2AA','#5F9EA0','#4682B4','#6A5ACD',
  '#9370DB','#CD853F','#D2691E','#A0522D','#708090',
  '#BC8F8F','#8FBC8F','#B8860B','#DAA520','#6495ED'
];
const colorMap = {};
let paletteIdx = 0;

function getColor(tipo) {
  if (!tipo) return '#aaa';
  if (!colorMap[tipo]) {
    colorMap[tipo] = PALETTE[paletteIdx % PALETTE.length];
    paletteIdx++;
  }
  return colorMap[tipo];
}

const map = L.map('map').setView([45.55, 8.65], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

// Raccogliamo tutti i layer e li passiamo a addControls quando tutti sono pronti
let layerPiemonte, layerLombardia, layerComuni, layerMalpensa, layerNatura, layerForeste;
let loaded = 0;
const TOTAL = 6;

function tryAddControls() {
  loaded++;
  if (loaded === TOTAL) addControls();
}

// Parco Piemontese (limiti_ticino = l'area di studio)
fetch(BASE + 'limiti_ticino.geojson')
  .then(r => r.json())
  .then(data => {
    layerPiemonte = L.geoJSON(data, {
      style: { color: '#003399', weight: 2.5, fillColor: '#3366ff', fillOpacity: 0.18 },
      onEachFeature: (f, l) => l.bindPopup('<b>Parco Naturale del Ticino Piemontese</b>')
    }).addTo(map);
    map.fitBounds(layerPiemonte.getBounds().pad(0.12));
    tryAddControls();
  });

// Parco Lombardo
fetch(BASE + 'parco_ticino_lombardia.geojson')
  .then(r => r.json())
  .then(data => {
    layerLombardia = L.geoJSON(data, {
      style: { color: '#006600', weight: 2, fillColor: '#33cc33', fillOpacity: 0.15 },
      onEachFeature: (f, l) => l.bindPopup('<b>Parco Lombardo della Valle del Ticino</b>')
    }).addTo(map);
    tryAddControls();
  });

// Comuni
fetch(BASE + 'limiti_comuni_ticino.geojson')
  .then(r => r.json())
  .then(data => {
    layerComuni = L.geoJSON(data, {
      style: { color: '#666', weight: 1, fillColor: 'transparent', fillOpacity: 0 },
      onEachFeature: (f, l) => {
        const p = f.properties;
        const nome = p && (p.COMUNE || p.comune || p.NAME || p.name || Object.values(p).find(v => typeof v === 'string'));
        if (nome) l.bindPopup('<b>' + nome + '</b>');
      }
    }).addTo(map);
    tryAddControls();
  });

// Malpensa — solo punto
fetch(BASE + 'malpensa_punto.geojson')
  .then(r => r.json())
  .then(data => {
    const icon = L.divIcon({ html: '✈', className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
    layerMalpensa = L.geoJSON(data, {
      pointToLayer: (f, latlng) => L.marker(latlng, { icon }),
      onEachFeature: (f, l) => l.bindPopup('<b>Aeroporto Internazionale di Malpensa</b>')
    }).addTo(map);
    tryAddControls();
  });

// Natura 2000 — spento
fetch(BASE + 'siti_rete_natura_2000.geojson')
  .then(r => r.json())
  .then(data => {
    layerNatura = L.geoJSON(data, {
      style: { color: '#8B4513', weight: 2, fillColor: 'transparent', dashArray: '6 4', fillOpacity: 0 },
      onEachFeature: (f, l) => {
        const p = f.properties;
        const nome = p && (p.SITENAME || p.sitename || p.NAME);
        l.bindPopup('<b>Sito Rete Natura 2000</b>' + (nome ? '<br>' + nome : ''));
      }
    });
    tryAddControls();
  });

// Carta Forestale — spenta, con colori per tipologia
fetch(BASE + 'carta_forestale_2025.geojson')
  .then(r => r.json())
  .then(data => {
    layerForeste = L.geoJSON(data, {
      style: f => ({
        color: '#555',
        weight: 0.4,
        fillColor: getColor(f.properties && f.properties.lc_tipi_10),
        fillOpacity: 0.75
      }),
      onEachFeature: (f, l) => {
        const p = f.properties || {};
        const tipo = p.lc_tipi_10 || '—';
        const area = p['Area (ha)'] != null ? Number(p['Area (ha)']).toFixed(2) : '—';
        l.bindPopup('<b>Tipologia forestale</b><br>' + tipo + '<br>Area: ' + area + ' ha');
      }
    });
    tryAddControls();
  });

function addControls() {
  const overlays = {
    'Parco Naturale del Ticino Piemontese': layerPiemonte,
    'Parco Lombardo della Valle del Ticino': layerLombardia,
    'Comuni': layerComuni,
    'Aeroporto Malpensa': layerMalpensa,
    'Carta Forestale 2025 (spento)': layerForeste,
    'Rete Natura 2000 (spento)': layerNatura
  };
  L.control.layers(null, overlays, { collapsed: false }).addTo(map);

  // Info box
  const info = L.control({ position: 'bottomleft' });
  info.onAdd = () => {
    const div = L.DomUtil.create('div', 'info-box');
    div.innerHTML = `<h4>Parco Naturale del Ticino Piemontese</h4>
      Superficie: ~6.500 ha<br>
      Istituito: 1978<br>
      Sito Natura 2000: IT1110020<br>
      In prossimità dell'Aeroporto di Malpensa.<br><br>
      Progetto: monitoraggio satellitare NDVI 1984–2025.`;
    return div;
  };
  info.addTo(map);

  // Legenda carta forestale (si aggiorna quando il layer è acceso)
  const legendCtrl = L.control({ position: 'bottomright' });
  legendCtrl.onAdd = () => {
    const div = L.DomUtil.create('div', 'legend');
    div.id = 'forest-legend';
    div.style.display = 'none';
    div.innerHTML = '<h4>Tipologie forestali</h4>';
    Object.entries(colorMap).forEach(([tipo, col]) => {
      div.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${col}"></div><span>${tipo}</span></div>`;
    });
    return div;
  };
  legendCtrl.addTo(map);

  map.on('overlayadd overlayremove', e => {
    const leg = document.getElementById('forest-legend');
    if (!leg) return;
    if (e.type === 'overlayadd' && e.name.includes('Carta Forestale')) {
      leg.style.display = 'block';
      leg.innerHTML = '<h4>Tipologie forestali</h4>';
      Object.entries(colorMap).forEach(([tipo, col]) => {
        leg.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${col}"></div><span>${tipo}</span></div>`;
      });
    }
    if (e.type === 'overlayremove' && e.name.includes('Carta Forestale')) {
      leg.style.display = 'none';
    }
  });
}
</script>

</body>
</html>
