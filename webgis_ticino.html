<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGIS — Parco Naturale del Ticino Piemontese</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { background: #1f4e5f; color: white; padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1.1rem; }
  header a { color: #a8d8ea; text-decoration: none; font-size: 0.85rem; margin-left: auto; }
  #map { flex: 1; }
  .info-box { background: white; padding: 0.6rem 0.9rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 0.82rem; line-height: 1.6; max-width: 230px; }
  .info-box h4 { color: #1f4e5f; margin-bottom: 0.4rem; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <h1>WebGIS — Parco Naturale del Ticino Piemontese</h1>
  <a href="ticino.html">← Torna al progetto</a>
</header>

<div id="map"></div>

<script>
const BASE = 'img/webgis/ticino/';

const map = L.map('map').setView([45.55, 8.65], 11);

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri, Maxar, Earthstar Geographics', maxZoom: 18
});

// Stili
const stylePiemonte = { color: '#003399', weight: 2.5, fillColor: '#3366ff', fillOpacity: 0.20 };
const styleLombardia = { color: '#006600', weight: 2, fillColor: '#33cc33', fillOpacity: 0.20 };
const styleComuni    = { color: '#555', weight: 1, fillColor: 'transparent', fillOpacity: 0 };
const styleMalpensa  = { color: '#8B0000', weight: 2.5, fillColor: '#FF0000', fillOpacity: 0.60 };
const styleNatura    = { color: '#8B4513', weight: 2, fillColor: 'transparent', dashArray: '6 4', fillOpacity: 0 };

let layerPiemonte, layerLombardia, layerComuni, layerMalpensaPoly, layerMalpensaPunto, layerNatura;

// Parco Naturale del Ticino Piemontese (limiti_ticino.geojson)
fetch(BASE + 'limiti_ticino.geojson')
  .then(r => r.json())
  .then(data => {
    layerPiemonte = L.geoJSON(data, {
      style: stylePiemonte,
      onEachFeature: (f, l) => l.bindPopup('<b>Parco Naturale del Ticino Piemontese</b><br>Area di studio del progetto')
    }).addTo(map);
    map.fitBounds(layerPiemonte.getBounds().pad(0.15));
  });

// Parco Regionale della Valle del Ticino – Lombardia (parco_ticino_lombardia.geojson)
fetch(BASE + 'parco_ticino_lombardia.geojson')
  .then(r => r.json())
  .then(data => {
    layerLombardia = L.geoJSON(data, {
      style: styleLombardia,
      onEachFeature: (f, l) => l.bindPopup('<b>Parco Regionale della Valle del Ticino</b><br>(Lombardia)')
    }).addTo(map);
  });

// Comuni
fetch(BASE + 'limiti_comuni_ticino.geojson')
  .then(r => r.json())
  .then(data => {
    layerComuni = L.geoJSON(data, {
      style: styleComuni,
      onEachFeature: (f, l) => {
        const nome = f.properties && (f.properties.COMUNE || f.properties.comune || f.properties.NAME || Object.values(f.properties)[0]);
        if (nome) l.bindPopup('<b>' + nome + '</b>');
      }
    }).addTo(map);
  });

// Malpensa poligono
fetch(BASE + 'malpensa_poligono.geojson')
  .then(r => r.json())
  .then(data => {
    layerMalpensaPoly = L.geoJSON(data, {
      style: styleMalpensa,
      onEachFeature: (f, l) => l.bindPopup('<b>Aeroporto Internazionale di Malpensa</b>')
    }).addTo(map);
  });

// Malpensa punto
fetch(BASE + 'malpensa_punto.geojson')
  .then(r => r.json())
  .then(data => {
    const icon = L.divIcon({ html: '✈', className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
    layerMalpensaPunto = L.geoJSON(data, {
      pointToLayer: (f, latlng) => L.marker(latlng, { icon }),
      onEachFeature: (f, l) => l.bindPopup('<b>Aeroporto Internazionale di Malpensa</b>')
    }).addTo(map);
  });

// Natura 2000 — parte SPENTO
fetch(BASE + 'siti_rete_natura_2000.geojson')
  .then(r => r.json())
  .then(data => {
    layerNatura = L.geoJSON(data, {
      style: styleNatura,
      onEachFeature: (f, l) => {
        const nome = f.properties && (f.properties.SITENAME || f.properties.sitename || f.properties.NAME);
        l.bindPopup('<b>Sito Rete Natura 2000</b>' + (nome ? '<br>' + nome : ''));
      }
    });
    addControls();
  });

function addControls() {
  const baseLayers = { 'OpenStreetMap': osm, 'Satellite (Esri)': satellite };
  const overlays = {
    'Parco Naturale del Ticino Piemontese': layerPiemonte,
    'Parco Reg. Valle del Ticino (Lombardia)': layerLombardia,
    'Comuni': layerComuni,
    'Aeroporto Malpensa': layerMalpensaPoly,
    'Malpensa (punto)': layerMalpensaPunto,
    'Rete Natura 2000 (spento)': layerNatura
  };
  L.control.layers(baseLayers, overlays, { collapsed: false }).addTo(map);

  const info = L.control({ position: 'bottomleft' });
  info.onAdd = () => {
    const div = L.DomUtil.create('div', 'info-box');
    div.innerHTML = '<h4>Parco del Ticino Piemontese</h4>Monitoraggio satellitare della vegetazione 1984–2025.<br><br>Clicca sui layer per informazioni.';
    return div;
  };
  info.addTo(map);
}
</script>

</body>
</html>
