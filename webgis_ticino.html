<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGIS — Parco Naturale del Ticino Piemontese</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { background: #1f4e5f; color: white; padding: 0.8rem 1.5rem; display: flex; align-items: center; }
  header h1 { font-size: 1.05rem; }
  header a { color: #a8d8ea; text-decoration: none; font-size: 0.85rem; margin-left: auto; }
  #map { flex: 1; }
  .info-box {
    background: white; padding: 0.8rem 1rem; border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 0.78rem;
    line-height: 1.55; max-width: 270px;
  }
  .info-box h4 { color: #1f4e5f; margin-bottom: 0.4rem; font-size: 0.88rem; border-bottom: 1px solid #ddd; padding-bottom: 0.3rem; }
  .info-box p { margin-bottom: 0.5rem; }
  .info-box .fonte { font-size: 0.7rem; color: #777; font-style: italic; margin-top: 0.4rem; }
  .legend { background: white; padding: 0.6rem 0.9rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 0.78rem; max-width: 210px; max-height: 280px; overflow-y: auto; }
  .legend h4 { color: #1f4e5f; margin-bottom: 0.4rem; font-size: 0.85rem; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .legend-color { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.2); }
</style>
</head>
<body>

<header>
  <h1>WebGIS — Parco Naturale del Ticino Piemontese</h1>
  <a href="ticino.html">← Torna al progetto</a>
</header>

<div id="map"></div>

<script>
const BASE = 'img/webgis/ticino/';

const PALETTE = [
  '#8B4513','#228B22','#556B2F','#6B8E23','#2E8B57',
  '#3CB371','#20B2AA','#5F9EA0','#4682B4','#6A5ACD',
  '#9370DB','#CD853F','#D2691E','#A0522D','#708090',
  '#BC8F8F','#8FBC8F','#B8860B','#DAA520','#6495ED'
];
const colorMap = {};
let paletteIdx = 0;

function getColor(tipo) {
  if (!tipo) return '#aaa';
  if (!colorMap[tipo]) { colorMap[tipo] = PALETTE[paletteIdx % PALETTE.length]; paletteIdx++; }
  return colorMap[tipo];
}

const map = L.map('map').setView([45.55, 8.65], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

let layerPiemonte, layerLombardia, layerNatura, layerForeste;
let loaded = 0;
const TOTAL = 4;

function tryAddControls() {
  loaded++;
  if (loaded === TOTAL) addControls();
}

fetch(BASE + 'limiti_ticino.geojson')
  .then(r => r.json())
  .then(data => {
    layerPiemonte = L.geoJSON(data, {
      style: { color: '#003399', weight: 2.5, fillColor: '#3366ff', fillOpacity: 0.15 },
      onEachFeature: (f, l) => l.bindPopup('<b>Parco Naturale del Ticino Piemontese</b>')
    }).addTo(map);
    map.fitBounds(layerPiemonte.getBounds().pad(0.12));
    tryAddControls();
  });

fetch(BASE + 'parco_ticino_lombardia.geojson')
  .then(r => r.json())
  .then(data => {
    layerLombardia = L.geoJSON(data, {
      style: { color: '#006600', weight: 2, fillColor: '#33cc33', fillOpacity: 0.12 },
      onEachFeature: (f, l) => l.bindPopup('<b>Parco Lombardo della Valle del Ticino</b>')
    }).addTo(map);
    tryAddControls();
  });

fetch(BASE + 'siti_rete_natura_2000.geojson')
  .then(r => r.json())
  .then(data => {
    layerNatura = L.geoJSON(data, {
      style: { color: '#8B4513', weight: 2, fillColor: 'transparent', dashArray: '6 4', fillOpacity: 0 },
      onEachFeature: (f, l) => {
        const p = f.properties;
        const nome = p && (p.SITENAME || p.sitename || p.NAME);
        l.bindPopup('<b>Sito Rete Natura 2000</b>' + (nome ? '<br>' + nome : ''));
      }
    });
    tryAddControls();
  });

fetch(BASE + 'carta_forestale_2025.geojson')
  .then(r => r.json())
  .then(data => {
    layerForeste = L.geoJSON(data, {
      style: f => ({
        color: '#555', weight: 0.4,
        fillColor: getColor(f.properties && f.properties.lc_tipi_10),
        fillOpacity: 0.75
      }),
      onEachFeature: (f, l) => {
        const p = f.properties || {};
        const tipo = p.lc_tipi_10 || '—';
        const area = p['Area (ha)'] != null ? Number(p['Area (ha)']).toFixed(2) : '—';
        l.bindPopup('<b>Tipologia forestale</b><br>' + tipo + '<br>Area: ' + area + ' ha');
      }
    });
    tryAddControls();
  });

function addControls() {
  const overlays = {
    'Parco Naturale del Ticino Piemontese': layerPiemonte,
    'Parco Lombardo della Valle del Ticino': layerLombardia,
    'Carta Forestale 2025': layerForeste,
    'Rete Natura 2000': layerNatura
  };
  L.control.layers(null, overlays, { collapsed: false }).addTo(map);

  // Info box
  const info = L.control({ position: 'bottomleft' });
  info.onAdd = () => {
    const div = L.DomUtil.create('div', 'info-box');
    div.innerHTML = `<h4>Il Parco del Ticino</h4>
      <p>In un territorio di pianura intensamente trasformato e frammentato come quello padano, le fasce fluviali rappresentano tra i pochi spazi naturali residui: serbatoi di biodiversità e al tempo stesso corridoi ecologici che assicurano la connettività tra gli ambienti naturali. Tra questi, il corridoio del fiume Ticino è uno dei più rilevanti.</p>
      <p>Il Parco Naturale del Ticino Piemontese, istituito nel 1978, si estende lungo la riva nord-occidentale del fiume Ticino, dall'uscita dal Lago Maggiore fino al confine con la Lombardia. Insieme al Parco Lombardo della Valle del Ticino costituisce l'area protetta fluviale più estesa d'Europa, riconosciuta nel circuito MAB UNESCO e inclusa nella rete Natura 2000.</p>
      <p>Il territorio alterna tratti di riva boscata a settori di valle più ampia, dove si susseguono boschi, prati stabili, coltivi, ghiareti e lanche; nei rami secondari a lento scorrimento del fiume si concentra gran parte della biodiversità legata all'ambiente fluviale.</p>
      <p class="fonte">Fonte: Ente di Gestione delle Aree Protette del Ticino e del Lago Maggiore</p>`;
    return div;
  };
  info.addTo(map);

  // Legenda carta forestale
  const legendCtrl = L.control({ position: 'bottomright' });
  legendCtrl.onAdd = () => {
    const div = L.DomUtil.create('div', 'legend');
    div.id = 'forest-legend';
    div.style.display = 'none';
    return div;
  };
  legendCtrl.addTo(map);

  function updateLegend() {
    const leg = document.getElementById('forest-legend');
    if (!leg) return;
    leg.innerHTML = '<h4>Tipologie forestali</h4>';
    Object.entries(colorMap).forEach(([tipo, col]) => {
      leg.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${col}"></div><span>${tipo}</span></div>`;
    });
  }

  map.on('overlayadd', e => {
    if (e.name === 'Carta Forestale 2025') {
      const leg = document.getElementById('forest-legend');
      if (leg) { leg.style.display = 'block'; updateLegend(); }
    }
  });
  map.on('overlayremove', e => {
    if (e.name === 'Carta Forestale 2025') {
      const leg = document.getElementById('forest-legend');
      if (leg) leg.style.display = 'none';
    }
  });
}
</script>

</body>
</html>
